services:
  db:
    image: postgres:16-alpine
    container_name: ddos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ddos_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ddos-backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ddos_detection
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  ml-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: ddos-ml-service
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./:/app

  nginx:
    image: nginx:1.27-alpine
    container_name: ddos-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - ml-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
